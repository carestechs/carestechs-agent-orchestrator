# lifecycle-agent@0.5.0-manual — FEAT-017
#
# Extends v0.4.0-manual with conditional mockup generation for tasks
# whose ``kind`` is ``"mockup"``.  After ``assign_task``, the flow
# resolver branches on ``current_task_is_mockup``:
#
#   true  → generate_mockup → confirm_mockup → generate_plan
#   false → generate_plan  (direct, unchanged from v0.4.0-manual)
#
# Both new nodes participate in the existing rejection-budget guard
# (``checkpoint_rejections_under_bound`` / ``terminate_rejection_budget``).
# All other nodes, transitions, signals, and memory contracts are
# byte-identical to v0.4.0-manual.
#
# Bootstrap wiring: ``register_lifecycle_v05_manual`` in
# ``src/app/modules/ai/executors/bootstrap.py``.  Delegates to
# ``register_lifecycle_v04_manual`` then layers two new bindings:
#   - ``generate_mockup``: LLMContentExecutor with ``generate_mockup.md``
#   - ``confirm_mockup``:  HumanExecutor (signal: ``mockup-approved``)
#
# New signal contract (docs/api-spec.md):
#   mockup-approved — payload: { outcome: "approve"|"reject", feedback?: str }

ref: lifecycle-agent@0.5.0-manual
version: "0.5.0-manual"
description: >
  Manual variant of the lifecycle with conditional mockup generation.
  Extends v0.4.0-manual: tasks with kind="mockup" route through
  generate_mockup → confirm_mockup before the plan step; all other
  task kinds proceed directly to generate_plan as before.

nodes:
  - name: start
    description: >
      Synthetic entry marker.
    inputSchema:
      type: object

  - name: load_work_item
    description: >
      Synthesize the work-item brief (LLM-content).
    inputSchema:
      type: object
      properties:
        workItemPath: {type: string}
      required: [workItemPath]

  - name: confirm_brief
    description: >
      Pause for operator-injected ``brief-confirmed`` signal before W1.
    inputSchema:
      type: object

  - name: register_work_item
    description: >
      Create the engine work item (W1).
    inputSchema:
      type: object

  - name: generate_tasks
    description: >
      Generate the task breakdown (LLM-content).
    inputSchema:
      type: object
      properties:
        workItemId: {type: string}
      required: [workItemId]

  - name: confirm_tasks
    description: >
      Pause for ``tasks-confirmed`` before fanning out to the engine.
    inputSchema:
      type: object

  - name: propose_tasks
    description: >
      T1xN create_item + T2+T4 per task + W2 (synchronous fanout).
    inputSchema:
      type: object

  - name: confirm_assignment
    description: >
      Pause for ``assignment-confirmed`` before T5 on the current task.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}

  - name: assign_task
    description: >
      Advance the current task via T5 (assigning → planning).
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: generate_mockup
    description: >
      Generate a self-contained HTML mockup for the current task
      (LLM-content). Only reached when the task's kind is "mockup".
      The operator reviews the rendered output at confirm_mockup before
      implementation work begins.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: confirm_mockup
    description: >
      Pause for ``mockup-approved`` signal. The operator reviews the
      HTML mockup surfaced in nodeInputs (mockupHtml + mockupDescription)
      and either approves (→ generate_plan) or rejects with feedback
      (→ generate_mockup, up to the rejection budget).
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: generate_plan
    description: >
      Author an implementation plan for the current task (LLM-content or
      platform plan-generation capability). Writes the plan to RunMemory.
      The sibling `advance_plan` node fires T6.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: advance_plan
    description: >
      Fire T6 (planning → plan_review) on the current task. Separated from
      `generate_plan` so the LLM authoring step and the engine transition
      are independent executor bindings.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: confirm_plan
    description: >
      Pause for ``plan-confirmed`` after T6.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: approve_plan
    description: >
      Fire T7 (plan_review → implementing) on the current task.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: request_implementation
    description: >
      Pause for ``implementation-complete`` signal.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: submit_implementation
    description: >
      Idempotent T9 (implementing → impl_review) on the current task.
    inputSchema:
      type: object

  - name: human_review_implementation
    description: >
      Pause for ``review-completed`` from a human reviewer.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: approve_review
    description: >
      Fire T10 (impl_review → done) on the current task.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: mark_task_done
    description: >
      Append the approved task id to completed_task_ids and advance
      current_task_id to the next pending task.
    inputSchema:
      type: object

  - name: correct_implementation
    description: >
      Record a rejection for the current task; loop or terminate on budget.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: close_work_item
    description: >
      Chain W4 + W6 to close the work item. Terminal node.
    inputSchema:
      type: object
      properties:
        workItemId: {type: string}
      required: [workItemId]

  - name: terminate_correction_budget
    description: >
      Terminal failure — correction budget exhausted.
    inputSchema:
      type: object
      properties:
        taskId: {type: string}
      required: [taskId]

  - name: terminate_rejection_budget
    description: >
      Terminal failure — checkpoint rejection budget exhausted.
    inputSchema:
      type: object
      properties: {}

flow:
  policy: deterministic
  entryNode: start
  transitions:
    start: [load_work_item]
    load_work_item:
      branch:
        rule: checkpoint_rejections_under_bound
        "true": confirm_brief
        "false": terminate_rejection_budget
    confirm_brief:
      branch:
        rule: checkpoint_approved
        "true": register_work_item
        "false": load_work_item
    register_work_item: [generate_tasks]
    generate_tasks:
      branch:
        rule: checkpoint_rejections_under_bound
        "true": confirm_tasks
        "false": terminate_rejection_budget
    confirm_tasks:
      branch:
        rule: checkpoint_approved
        "true": propose_tasks
        "false": generate_tasks
    propose_tasks: [confirm_assignment]
    confirm_assignment: [assign_task]
    assign_task:
      branch:
        rule: current_task_is_mockup
        "true": generate_mockup
        "false": generate_plan
    generate_mockup:
      branch:
        rule: checkpoint_rejections_under_bound
        "true": confirm_mockup
        "false": terminate_rejection_budget
    confirm_mockup:
      branch:
        rule: checkpoint_approved
        "true": generate_plan
        "false": generate_mockup
    generate_plan: [advance_plan]
    advance_plan:
      branch:
        rule: checkpoint_rejections_under_bound
        "true": confirm_plan
        "false": terminate_rejection_budget
    confirm_plan:
      branch:
        rule: checkpoint_approved
        "true": approve_plan
        "false": generate_plan
    approve_plan: [request_implementation]
    request_implementation: [submit_implementation]
    submit_implementation: [human_review_implementation]
    human_review_implementation:
      branch:
        rule: review_passed
        "true": approve_review
        "false": correct_implementation
    approve_review: [mark_task_done]
    mark_task_done:
      branch:
        rule: tasks_remaining
        "true": confirm_assignment
        "false": close_work_item
    correct_implementation:
      branch:
        rule: correction_attempts_under_bound
        "true": request_implementation
        "false": terminate_correction_budget
    close_work_item: []
    terminate_correction_budget: []
    terminate_rejection_budget: []

intakeSchema:
  type: object
  properties:
    workItem:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [FEAT, BUG, IMP]}
        content: {type: string}
      required: [id, kind]
    workItemPath: {type: string}
    codeSource:
      type: object
      required: [repo, baseBranch]
      additionalProperties: false
      properties:
        repo:        {type: string, pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"}
        baseBranch:  {type: string, minLength: 1}
        workBranch:  {type: string, minLength: 1}
  anyOf:
    - required: [workItem]
    - required: [workItemPath]

terminalNodes: [close_work_item, terminate_correction_budget, terminate_rejection_budget]

defaultBudget:
  maxSteps: 600
